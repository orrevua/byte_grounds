<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ByteGrounds Map Editor</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #14161a; color: #e6e8eb;
        font-family: system-ui, sans-serif; font-size: 14px; }
      #editor { display: grid; grid-template-columns: 280px 1fr; height: 100%; }
      aside { background: #1e2228; padding: 12px; overflow-y: auto; display: flex;
        flex-direction: column; gap: 14px; }
      main { overflow: auto; padding: 16px; }
      h1 { font-size: 16px; margin: 0; display: flex; justify-content: space-between; align-items: center; }
      h1 a { color: #8fb4ff; font-size: 13px; font-weight: 400; }
      h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: #9aa3ad; margin: 0 0 6px; }
      .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
      input, select, button { font: inherit; color: #e6e8eb; background: #14161a;
        border: 1px solid #333a44; border-radius: 6px; padding: 5px 8px; }
      input[type=number] { width: 64px; }
      input[type=color] { padding: 0; width: 36px; height: 30px; }
      button { cursor: pointer; background: #2a2f37; }
      button.primary { background: #4f8cff; border-color: #4f8cff; color: #fff; font-weight: 600; }
      button.danger { background: #5a2a2a; border-color: #7a3a3a; }
      .tools { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
      .tools button.active { background: #4f8cff; border-color: #4f8cff; color: #fff; }
      .swatches { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
      .swatches button { height: 24px; padding: 0; border-radius: 4px; }
      #sheet-wrap { max-height: 360px; overflow: auto; background: #0d0f12; border-radius: 6px; }
      #sheet { display: block; image-rendering: pixelated; cursor: crosshair; }
      #map-canvas { display: block; image-rendering: pixelated; cursor: crosshair;
        touch-action: none; }
      .hint { color: #9aa3ad; font-size: 12px; line-height: 1.4; }
      .status { font-size: 12px; color: #9aa3ad; min-height: 1em; }
      .status.error { color: #ffb4b4; }
      .status.retry { cursor: pointer; text-decoration: underline; }
      label.check { display: flex; gap: 6px; align-items: center; font-size: 13px; }
      #gate { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center;
        justify-content: center; padding: 16px; background: rgba(20, 22, 26, .97); }
      .gate-box { max-width: 420px; padding: 20px 24px; border-radius: 10px; background: #1e2228;
        line-height: 1.5; }
      .gate-box h2 { font-size: 16px; text-transform: none; letter-spacing: 0; color: #e6e8eb; }
      .gate-box a { color: #8fb4ff; }
      @media (max-width: 720px) {
        #editor { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
        aside { max-height: 50vh; }
      }
    </style>
  </head>
  <body>
    <div id="editor"></div>
    <script type="module" src="/src/editor.ts"></script>
  </body>
</html>
