    <style>

      #screen-stage video { display: block; width: 100%; max-height: 70vh; background: #000; object-fit: contain; }
      #screen-stage.min video { display: none; }
      @media (max-width: 900px) {
        #screen-stage { top: auto; bottom: 120px; width: calc(100vw - 24px); min-width: 0; }
      }
      #meet-pill { position: fixed; left: 50%; bottom: 160px; transform: translateX(-50%); z-index: 15;
        padding: 10px 18px; border: 0; border-radius: 999px; background: #1a73e8; color: #fff;
        font: 600 14px system-ui, sans-serif; cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,.4);
        white-space: nowrap; animation: pill-in .25s ease-out; }
      #meet-pill:hover { background: #1b66c9; }
      @keyframes pill-in { from { opacity: 0; transform: translate(-50%, 8px); } }
      .touch-ui #meet-pill { left: 16px; transform: none; bottom: 396px; padding: 7px 13px; font-size: 13px; }
      @media (orientation: landscape) { .touch-ui #meet-pill { left: 192px; bottom: 142px; } }
      #meeting { position: fixed; inset: 0; z-index: 60; display: flex; flex-direction: column;
        background: #202124; color: #e8eaed; font-family: 'Google Sans', Roboto, system-ui, sans-serif; }
      .meet-main { flex: 1; min-height: 0; display: flex; gap: 16px; padding: 16px 16px 0; }
      .meet-stage { flex: 1; min-width: 0; position: relative; display: flex; align-items: center;
        justify-content: center; background: #000; border-radius: 12px; overflow: hidden; }
      .meet-stage video { width: 100%; height: 100%; object-fit: contain; }
      .meet-stage-label { position: absolute; left: 12px; bottom: 12px; padding: 4px 10px; border-radius: 6px;
        background: rgba(32, 33, 36, .75); font-size: 13px; font-weight: 500; }
      .meet-grid { flex: 1; min-width: 0; display: grid; gap: 12px; align-content: center;
        grid-template-columns: repeat(var(--cols, 1), minmax(0, 1fr)); overflow-y: auto; }
      #meeting.presenting .meet-grid { flex: 0 0 260px; align-content: start; }
      .meet-tile { position: relative; aspect-ratio: 16 / 9; max-height: calc((100vh - 120px));
        background: #3c4043; border-radius: 12px; overflow: hidden; display: flex; align-items: center;
        justify-content: center; }
      .meet-tile video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
      .meet-tile.self video { transform: scaleX(-1); }
      .meet-tile.has-video video { display: block; }
      .meet-face { width: min(38%, 132px); aspect-ratio: 1; border-radius: 50%; image-rendering: pixelated;
        object-fit: contain; padding: 6%; }
      .meet-tile.has-video .meet-face { display: none; }
      /* Talking: a green ring around the face (or the whole tile when the camera is on). */
      .meet-face { transition: box-shadow .12s; }
      .meet-tile.speaking .meet-face { box-shadow: 0 0 0 4px #4fe0a0, 0 0 18px 4px rgba(79, 224, 160, .45); }
      .meet-tile::after { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
        box-shadow: inset 0 0 0 3px transparent; transition: box-shadow .12s; }
      .meet-tile.speaking.has-video::after { box-shadow: inset 0 0 0 3px #4fe0a0; }
      .meet-muted { position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; border-radius: 50%;
        background: rgba(32, 33, 36, .75); color: #fff; display: none; align-items: center; justify-content: center; }
      .meet-muted svg { width: 18px; height: 18px; }
      .meet-tile.muted .meet-muted { display: flex; }
      .meet-name { position: absolute; left: 12px; bottom: 10px; font-size: 13px; font-weight: 500;
        text-shadow: 0 1px 2px rgba(0,0,0,.6); }
      .meet-bar { height: 80px; flex: none; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
        padding: 0 20px; gap: 12px; }
      .meet-info { font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .meet-sep { margin: 0 12px; color: #9aa0a6; }
      .meet-controls { display: flex; gap: 10px; }
      .meet-btn { height: 44px; min-width: 44px; padding: 0 12px; border: 0; border-radius: 999px;
        background: #3c4043; color: #e8eaed; display: inline-flex; align-items: center; justify-content: center;
        gap: 8px; cursor: pointer; font: 500 14px system-ui, sans-serif; }
      .meet-btn:hover { filter: brightness(1.15); }
      .meet-btn.off { background: #ea4335; color: #fff; }
      .meet-btn.on { background: #8ab4f8; color: #202124; }
      .meet-leave { background: #ea4335; color: #fff; min-width: 64px; }
      .meet-side { display: flex; justify-content: flex-end; align-items: center; gap: 14px; }
      .meet-people { display: inline-flex; align-items: center; gap: 6px; color: #e8eaed; font-size: 14px; }
      @media (max-width: 720px) {
        .meet-main { flex-direction: column; }
        #meeting.presenting .meet-grid { flex: 0 0 auto; grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .meet-bar { grid-template-columns: 1fr; height: auto; padding: 10px; justify-items: center; }
        .meet-info, .meet-back span { display: none; }
      }
      #stage { touch-action: none; }
      #zoom-ctl { position: fixed; right: 12px; top: 56px; z-index: 15; display: flex; flex-direction: column;
        align-items: center; gap: 2px; padding: 4px; border-radius: 999px; background: rgba(30, 34, 40, .9);
        box-shadow: 0 4px 14px rgba(0,0,0,.35); }
      #zoom-ctl button { width: 30px; height: 30px; border: 0; border-radius: 50%; background: #2a2f37;
        color: #e6e8eb; font: 700 17px system-ui, sans-serif; cursor: pointer; line-height: 1; }
      #zoom-ctl button:hover:not(:disabled) { background: #3a414c; }
      #zoom-ctl button:disabled { opacity: .35; cursor: default; }
      #zoom-ctl span { font: 600 10px system-ui, sans-serif; color: #9aa3ad; padding: 2px 0; }
      #toast { position: fixed; top: 56px; left: 50%; transform: translateX(-50%); z-index: 40;
        max-width: 90vw; padding: 8px 14px; border-radius: 8px; background: #5a2a2a; color: #fff;
        font-size: 13px; box-shadow: 0 4px 14px rgba(0,0,0,.35); }
      #toast.info { background: #2d4f6e; }
    </style>
  </head>
