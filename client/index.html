<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ByteGrounds</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #14161a; color: #e6e8eb;
        font-family: system-ui, sans-serif; }
      #app { position: relative; width: 100%; height: 100%; }
      #join { position: absolute; inset: 0; display: flex; align-items: center;
        justify-content: center; }
      .panel { background: #1e2228; padding: 24px 28px; border-radius: 10px;
        display: flex; flex-direction: column; gap: 12px; min-width: 260px; }
      .panel h1 { margin: 0 0 4px; font-size: 18px; }
      .panel label { display: flex; align-items: center; justify-content: space-between;
        gap: 12px; font-size: 14px; }
      .panel input { background: #14161a; color: #e6e8eb; border: 1px solid #333a44;
        border-radius: 6px; padding: 6px 8px; }
      .panel button { margin-top: 6px; padding: 8px; border: 0; border-radius: 6px;
        background: #4f8cff; color: #fff; font-weight: 600; cursor: pointer; }
      canvas { display: block; max-width: 100%; height: auto; image-rendering: pixelated; }
      .editor { display: flex; align-items: center; gap: 16px; }
      #preview { width: 96px; height: 96px; image-rendering: pixelated;
        background: #14161a; border: 1px solid #333a44; border-radius: 8px; }
      .axes { display: flex; flex-direction: column; gap: 6px; flex: 1; }
      .axis { display: grid; grid-template-columns: 28px 1fr 28px; align-items: center;
        gap: 6px; }
      .panel button.arrow { margin: 0; padding: 4px 0; background: #14161a;
        border: 1px solid #333a44; border-radius: 6px; color: #e6e8eb; font-weight: 600; }
      .axis-label { text-align: center; font-size: 13px; }
      .axis.disabled { opacity: .4; }
      .preset-label { font-size: 14px; }
      #presets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
      .panel button.preset { margin: 0; padding: 6px 4px; background: #14161a;
        border: 1px solid #333a44; border-radius: 6px; color: #e6e8eb; font-size: 12px; }
      .panel button#shuffle { background: #2d6e4e; }
      #net-banner { position: fixed; top: 0; left: 0; right: 0; z-index: 20;
        text-align: center; padding: 6px; font-size: 13px; font-weight: 600; }
      .net-banner-connecting, .net-banner-reconnecting { background: #b5842a; color: #14161a; }
      .net-banner-closed { background: #a33; color: #fff; }
      .hidden { display: none !important; }
      #seat-btn, #dance-btn { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
        z-index: 15; padding: 10px 18px; border: 0; border-radius: 999px; background: #4f8cff;
        color: #fff; font: 600 14px system-ui, sans-serif; cursor: pointer;
        box-shadow: 0 4px 14px rgba(0,0,0,.35); }
      #dance-btn { bottom: 64px; }
      @media (pointer: coarse) {
        #seat-btn, #dance-btn { bottom: 212px; padding: 14px 22px; font-size: 16px; }
        #dance-btn { bottom: 268px; }
      }
      .panel select { background: #14161a; color: #e6e8eb; border: 1px solid #333a44;
        border-radius: 6px; padding: 6px 8px; max-width: 170px; }
      .join-error { color: #ffb4b4; font-size: 12px; max-width: 260px; }
      .join-error:empty { display: none; }
      .editor-link { color: #8fb4ff; font-size: 13px; text-align: center; }
      .admin-box { font-size: 13px; text-align: center; color: #9aa3ad; }
      .admin-box:empty { display: none; }
      .panel button.link { margin: 0; padding: 0; background: none; color: #8fb4ff;
        font-weight: 400; font-size: 13px; }
      .admin-form { display: flex; flex-direction: column; gap: 6px; }
      .admin-form .join-error { max-width: none; }
      #avatar-menu { position: fixed; z-index: 30; display: flex; flex-direction: column; gap: 6px;
        min-width: 190px; padding: 10px; border: 1px solid #333a44; border-radius: 8px;
        background: #1e2228; font-size: 13px; box-shadow: 0 6px 18px rgba(0,0,0,.45); }
      #avatar-menu .who { font-weight: 600; }
      #avatar-menu .sid { color: #9aa3ad; font-weight: 400; }
      #avatar-menu button { padding: 6px 10px; border: 1px solid #333a44; border-radius: 6px;
        background: #14161a; color: #e6e8eb; font: inherit; text-align: left; cursor: pointer; }
      #avatar-menu button.on { background: #2d6e4e; border-color: #3d8e64; }
      #avatar-menu button:disabled { opacity: .6; cursor: default; }
      #avatar-menu .menu-note { color: #9aa3ad; max-width: 240px; line-height: 1.35; }
      #avatar-menu .menu-error { color: #ffb4b4; }
      #build-btn { position: fixed; top: 12px; right: 12px; z-index: 15; padding: 8px 16px; border: 0;
        border-radius: 999px; background: #2d6e4e; color: #fff; font: 600 14px system-ui, sans-serif;
        cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,.35); }
      #build-btn.on { background: #4f8cff; }
      #build-panel { position: fixed; top: 0; right: 0; bottom: 0; width: 300px; z-index: 25;
        display: flex; flex-direction: column; gap: 8px; padding: 12px; overflow-y: auto;
        background: #1e2228; font-size: 13px; box-shadow: -6px 0 18px rgba(0,0,0,.45); }
      #build-panel .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
      #build-panel .build-head { justify-content: space-between; font-size: 15px; }
      #build-panel select, #build-panel button { font: inherit; color: #e6e8eb; background: #2a2f37;
        border: 1px solid #333a44; border-radius: 6px; padding: 5px 8px; cursor: pointer; }
      #build-panel select { background: #14161a; }
      #build-panel .tools { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
      #build-panel .tools button.active { background: #4f8cff; border-color: #4f8cff; color: #fff; }
      #build-panel .hint { color: #9aa3ad; font-size: 12px; line-height: 1.4; margin: 4px 0; }
      #build-panel #sheet-wrap { max-height: 320px; overflow: auto; background: #0d0f12; border-radius: 6px; }
      #build-panel #sheet { max-width: none; cursor: crosshair; }
      @media (max-width: 720px) {
        #build-panel { top: auto; left: 0; width: auto; height: 45vh; box-shadow: 0 -6px 18px rgba(0,0,0,.45); }
      }
      #toast { position: fixed; top: 56px; left: 50%; transform: translateX(-50%); z-index: 40;
        max-width: 90vw; padding: 8px 14px; border-radius: 8px; background: #5a2a2a; color: #fff;
        font-size: 13px; box-shadow: 0 4px 14px rgba(0,0,0,.35); }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
