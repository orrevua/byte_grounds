<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="A tiny virtual office for friends: walk up to someone and just talk." />
    <meta name="theme-color" content="#14161a" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ByteGrounds" />
    <meta property="og:title" content="ByteGrounds" />
    <meta property="og:description" content="A tiny virtual office for friends: walk up to someone and just talk." />
    <meta property="og:image" content="__SITE_URL__/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ByteGrounds" />

    <title>ByteGrounds</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #14161a; color: #e6e8eb;
        font-family: system-ui, sans-serif; }
      #app { position: relative; width: 100%; height: 100%; }
      /* Scrolls when the panel is taller than the window; margin:auto centres without clipping. */
      #join { position: absolute; inset: 0; display: flex; overflow-y: auto; padding: 16px; }
      .panel { margin: auto; background: #1e2228; padding: 24px 28px; border-radius: 10px;
        display: flex; flex-direction: column; gap: 12px; min-width: 260px; }
      .panel h1 { margin: 0; font-size: 22px; letter-spacing: .01em; }
      .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
      .brand img { image-rendering: pixelated; flex: none; }
      .brand .lang-switch { margin-left: auto; align-self: flex-start; padding: 4px 6px; }
      .tagline { margin: 2px 0 0; font-size: 13px; color: #9aa3ad; }
      #join { background:
          radial-gradient(ellipse at 50% 35%, rgba(79, 140, 255, .14), transparent 60%),
          repeating-conic-gradient(#191c21 0 25%, #16191d 0 50%) 0 0 / 64px 64px; }
      .panel { border: 1px solid #2c323b; box-shadow: 0 18px 50px rgba(0, 0, 0, .45); }
      .panel label { display: flex; align-items: center; justify-content: space-between;
        gap: 12px; font-size: 14px; }
      .panel input { background: #14161a; color: #e6e8eb; border: 1px solid #333a44;
        border-radius: 6px; padding: 6px 8px; }
      .panel button { margin-top: 6px; padding: 8px; border: 0; border-radius: 6px;
        background: #4f8cff; color: #fff; font-weight: 600; cursor: pointer; }
      canvas { display: block; max-width: 100%; height: auto; image-rendering: pixelated; }
      .editor { display: flex; align-items: center; gap: 16px; }
      #preview { width: 96px; height: 96px; image-rendering: pixelated;
        background: #14161a; border: 1px solid #333a44; border-radius: 8px; }
      .axes { display: flex; flex-direction: column; gap: 6px; flex: 1; }
      .axis { display: grid; grid-template-columns: 28px 1fr 28px; align-items: center;
        gap: 6px; }
      .panel button.arrow { margin: 0; padding: 4px 0; background: #14161a;
        border: 1px solid #333a44; border-radius: 6px; color: #e6e8eb; font-weight: 600; }
      .axis-label { text-align: center; font-size: 13px; }
      .axis.disabled { opacity: .4; }
      .preset-label { font-size: 14px; }
      #presets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
      .panel button.preset { margin: 0; padding: 6px 4px; background: #14161a;
        border: 1px solid #333a44; border-radius: 6px; color: #e6e8eb; font-size: 12px; }
      .panel button#shuffle { background: #2d6e4e; }
      #net-banner { position: fixed; top: 0; left: 0; right: 0; z-index: 20;
        text-align: center; padding: 6px; font-size: 13px; font-weight: 600; }
      .net-banner-connecting, .net-banner-reconnecting { background: #b5842a; color: #14161a; }
      .net-banner-closed { background: #a33; color: #fff; }
      .hidden { display: none !important; }
      #seat-btn, #dance-btn, #drink-btn { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
        z-index: 15; padding: 10px 18px; border: 0; border-radius: 999px; background: #4f8cff;
        color: #fff; font: 600 14px system-ui, sans-serif; cursor: pointer;
        box-shadow: 0 4px 14px rgba(0,0,0,.35); }
      #dance-btn { bottom: 64px; }
      #drink-btn { bottom: 112px; background: #8a5a2b; }
      @media (pointer: coarse) {
        #seat-btn, #dance-btn, #drink-btn { bottom: 212px; padding: 14px 22px; font-size: 16px; }
        #dance-btn { bottom: 268px; }
        #drink-btn { bottom: 324px; }
      }
      .panel select { background: #14161a; color: #e6e8eb; border: 1px solid #333a44;
        border-radius: 6px; padding: 6px 8px; max-width: 170px; }
      .join-error { color: #ffb4b4; font-size: 12px; max-width: 260px; }
      .join-error:empty { display: none; }
      .editor-link { color: #8fb4ff; font-size: 13px; text-align: center; }
      .admin-box { font-size: 13px; text-align: center; color: #9aa3ad; }
      .admin-box:empty { display: none; }
      .panel button.link { margin: 0; padding: 0; background: none; color: #8fb4ff;
        font-weight: 400; font-size: 13px; }
      .admin-form { display: flex; flex-direction: column; gap: 6px; }
      .admin-form .join-error { max-width: none; }
      #avatar-menu { position: fixed; z-index: 30; display: flex; flex-direction: column; gap: 6px;
        min-width: 190px; padding: 10px; border: 1px solid #333a44; border-radius: 8px;
        background: #1e2228; font-size: 13px; box-shadow: 0 6px 18px rgba(0,0,0,.45); }
      #avatar-menu .who { font-weight: 600; }
      #avatar-menu .sid { color: #9aa3ad; font-weight: 400; }
      #avatar-menu button { padding: 6px 10px; border: 1px solid #333a44; border-radius: 6px;
        background: #14161a; color: #e6e8eb; font: inherit; text-align: left; cursor: pointer; }
      #avatar-menu button.on { background: #2d6e4e; border-color: #3d8e64; }
      #avatar-menu button:disabled { opacity: .6; cursor: default; }
      #avatar-menu .menu-note { color: #9aa3ad; max-width: 240px; line-height: 1.35; }
      #avatar-menu .menu-error { color: #ffb4b4; }
      #minimap { position: fixed; right: 12px; bottom: 12px; z-index: 12; display: flex;
        flex-direction: column; align-items: flex-end; gap: 6px; }
      #minimap canvas { display: block; border: 2px solid #333a44; border-radius: 6px;
        background: #14161a; cursor: crosshair; touch-action: none;
        box-shadow: 0 4px 14px rgba(0,0,0,.35); }
      #minimap button { padding: 4px 10px; border: 0; border-radius: 999px; background: #4f8cff;
        color: #fff; font: 600 12px system-ui, sans-serif; cursor: pointer; }
      #minimap.touch { bottom: 210px; right: 16px; }
      /* Too narrow to sit beside the centred Sit / Dance buttons: top-right, below Build. */
      @media (max-width: 359px) { #minimap.touch { top: 56px; bottom: auto; } }
      #build-btn { position: fixed; top: 12px; right: 12px; z-index: 15; padding: 8px 16px; border: 0;
        border-radius: 999px; background: #2d6e4e; color: #fff; font: 600 14px system-ui, sans-serif;
        cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,.35); }
      #build-btn.on { background: #4f8cff; }
      #build-panel { position: fixed; top: 0; right: 0; bottom: 0; width: 300px; z-index: 25;
        display: flex; flex-direction: column; gap: 8px; padding: 12px; overflow-y: auto;
        background: #1e2228; font-size: 13px; box-shadow: -6px 0 18px rgba(0,0,0,.45); }
      #build-panel .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
      #build-panel .build-head { justify-content: space-between; font-size: 15px; }
      #build-panel select, #build-panel button { font: inherit; color: #e6e8eb; background: #2a2f37;
        border: 1px solid #333a44; border-radius: 6px; padding: 5px 8px; cursor: pointer; }
      #build-panel select { background: #14161a; }
      #build-panel .tools { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
      #build-panel .tools button.active { background: #4f8cff; border-color: #4f8cff; color: #fff; }
      #build-panel .hint { color: #9aa3ad; font-size: 12px; line-height: 1.4; margin: 4px 0; }
      #build-panel #sheet-wrap { max-height: 320px; overflow: auto; background: #0d0f12; border-radius: 6px; }
      #build-panel #sheet { max-width: none; cursor: crosshair; }
      @media (max-width: 720px) {
        #build-panel { top: auto; left: 0; width: auto; height: 45vh; box-shadow: 0 -6px 18px rgba(0,0,0,.45); }
      }
      #hud { position: fixed; top: 12px; left: 12px; z-index: 16; display: flex; flex-direction: column;
        gap: 8px; width: min(320px, calc(100vw - 24px)); pointer-events: none; }
      #hud > * { pointer-events: auto; }
      .hud-bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
      .hud-bar button, .hud-status-input { padding: 6px 12px; border: 0; border-radius: 999px;
        background: #2a2f37; color: #e6e8eb; font: 600 13px system-ui, sans-serif; cursor: pointer;
        box-shadow: 0 4px 14px rgba(0,0,0,.35); }
      .hud-bar button:hover { background: #343a44; }
      .hud-bar button.on { background: #4f8cff; color: #fff; }
      .hud-bar .hud-busy.on { background: #6b5bd6; }
      .hud-bar .hud-status { max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        font-weight: 400; color: #9fd0ff; font-style: italic; }
      .hud-bar .hud-status.empty { color: #9aa3ad; }
      .hud-status-input { flex: 1; min-width: 160px; cursor: text; font-weight: 400; outline: 2px solid #4f8cff; }
      .hud-panel { display: flex; flex-direction: column; background: rgba(30, 34, 40, .92);
        border: 1px solid #2c323b; border-radius: 10px; box-shadow: 0 6px 18px rgba(0,0,0,.45);
        max-height: min(40vh, calc(100vh - 300px)); min-height: 120px; }
      .chat-log { flex: 1; overflow-y: auto; padding: 8px 10px; font-size: 13px; line-height: 1.4;
        display: flex; flex-direction: column; gap: 3px; word-wrap: break-word; }
      .chat-log:empty::before { content: 'No messages yet. Say hi, or type /help.'; color: #6f7883; }
      .chat-line b { color: #8fb4ff; font-weight: 600; }
      .chat-line.self b { color: #4fe0a0; }
      .chat-line.note { color: #9aa3ad; font-style: italic; font-size: 12px; }
      .chat-form { border-top: 1px solid #2c323b; padding: 6px; }
      .chat-form input { width: 100%; padding: 7px 9px; border: 1px solid #333a44; border-radius: 6px;
        background: #14161a; color: #e6e8eb; font: 13px system-ui, sans-serif; }
      .chat-form input:focus { outline: none; border-color: #4f8cff; }
      #screen-stage { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 14;
        width: min(960px, calc(100vw - 700px)); min-width: min(480px, calc(100vw - 24px));
        display: flex; flex-direction: column; background: #0d0f12; border: 2px solid #4f8cff;
        border-radius: 10px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.55); }
      #screen-stage .stage-head { display: flex; align-items: center; justify-content: space-between;
        gap: 8px; padding: 6px 10px; background: #1e2228; font: 600 13px system-ui, sans-serif; }
      #screen-stage .stage-head button { padding: 4px 10px; border: 0; border-radius: 999px;
        background: #2a2f37; color: #e6e8eb; font: 600 12px system-ui, sans-serif; cursor: pointer; }
      #screen-stage video { display: block; width: 100%; max-height: 70vh; background: #000; object-fit: contain; }
      #screen-stage.min video { display: none; }
      @media (max-width: 900px) {
        #screen-stage { top: auto; bottom: 120px; width: calc(100vw - 24px); min-width: 0; }
      }
      #meet-pill { position: fixed; left: 50%; bottom: 160px; transform: translateX(-50%); z-index: 15;
        padding: 10px 18px; border: 0; border-radius: 999px; background: #1a73e8; color: #fff;
        font: 600 14px system-ui, sans-serif; cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,.4);
        white-space: nowrap; animation: pill-in .25s ease-out; }
      #meet-pill:hover { background: #1b66c9; }
      @keyframes pill-in { from { opacity: 0; transform: translate(-50%, 8px); } }
      @media (pointer: coarse) { #meet-pill { bottom: 380px; } }
      #meeting { position: fixed; inset: 0; z-index: 60; display: flex; flex-direction: column;
        background: #202124; color: #e8eaed; font-family: 'Google Sans', Roboto, system-ui, sans-serif; }
      .meet-main { flex: 1; min-height: 0; display: flex; gap: 16px; padding: 16px 16px 0; }
      .meet-stage { flex: 1; min-width: 0; position: relative; display: flex; align-items: center;
        justify-content: center; background: #000; border-radius: 12px; overflow: hidden; }
      .meet-stage video { width: 100%; height: 100%; object-fit: contain; }
      .meet-stage-label { position: absolute; left: 12px; bottom: 12px; padding: 4px 10px; border-radius: 6px;
        background: rgba(32, 33, 36, .75); font-size: 13px; font-weight: 500; }
      .meet-grid { flex: 1; min-width: 0; display: grid; gap: 12px; align-content: center;
        grid-template-columns: repeat(var(--cols, 1), minmax(0, 1fr)); overflow-y: auto; }
      #meeting.presenting .meet-grid { flex: 0 0 260px; align-content: start; }
      .meet-tile { position: relative; aspect-ratio: 16 / 9; max-height: calc((100vh - 120px));
        background: #3c4043; border-radius: 12px; overflow: hidden; display: flex; align-items: center;
        justify-content: center; }
      .meet-tile video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
      .meet-tile.self video { transform: scaleX(-1); }
      .meet-tile.has-video video { display: block; }
      .meet-face { width: min(38%, 132px); aspect-ratio: 1; border-radius: 50%; image-rendering: pixelated;
        object-fit: contain; padding: 6%; }
      .meet-tile.has-video .meet-face { display: none; }
      /* Talking: a green ring around the face (or the whole tile when the camera is on). */
      .meet-face { transition: box-shadow .12s; }
      .meet-tile.speaking .meet-face { box-shadow: 0 0 0 4px #4fe0a0, 0 0 18px 4px rgba(79, 224, 160, .45); }
      .meet-tile::after { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
        box-shadow: inset 0 0 0 3px transparent; transition: box-shadow .12s; }
      .meet-tile.speaking.has-video::after { box-shadow: inset 0 0 0 3px #4fe0a0; }
      .meet-muted { position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; border-radius: 50%;
        background: rgba(32, 33, 36, .75); color: #fff; display: none; align-items: center; justify-content: center; }
      .meet-muted svg { width: 18px; height: 18px; }
      .meet-tile.muted .meet-muted { display: flex; }
      .meet-name { position: absolute; left: 12px; bottom: 10px; font-size: 13px; font-weight: 500;
        text-shadow: 0 1px 2px rgba(0,0,0,.6); }
      .meet-bar { height: 80px; flex: none; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
        padding: 0 20px; gap: 12px; }
      .meet-info { font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .meet-sep { margin: 0 12px; color: #9aa0a6; }
      .meet-controls { display: flex; gap: 10px; }
      .meet-btn { height: 44px; min-width: 44px; padding: 0 12px; border: 0; border-radius: 999px;
        background: #3c4043; color: #e8eaed; display: inline-flex; align-items: center; justify-content: center;
        gap: 8px; cursor: pointer; font: 500 14px system-ui, sans-serif; }
      .meet-btn:hover { filter: brightness(1.15); }
      .meet-btn.off { background: #ea4335; color: #fff; }
      .meet-btn.on { background: #8ab4f8; color: #202124; }
      .meet-leave { background: #ea4335; color: #fff; min-width: 64px; }
      .meet-side { display: flex; justify-content: flex-end; align-items: center; gap: 14px; }
      .meet-people { display: inline-flex; align-items: center; gap: 6px; color: #e8eaed; font-size: 14px; }
      @media (max-width: 720px) {
        .meet-main { flex-direction: column; }
        #meeting.presenting .meet-grid { flex: 0 0 auto; grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .meet-bar { grid-template-columns: 1fr; height: auto; padding: 10px; justify-items: center; }
        .meet-info, .meet-back span { display: none; }
      }
      #stage { touch-action: none; }
      #zoom-ctl { position: fixed; right: 12px; top: 56px; z-index: 15; display: flex; flex-direction: column;
        align-items: center; gap: 2px; padding: 4px; border-radius: 999px; background: rgba(30, 34, 40, .9);
        box-shadow: 0 4px 14px rgba(0,0,0,.35); }
      #zoom-ctl button { width: 30px; height: 30px; border: 0; border-radius: 50%; background: #2a2f37;
        color: #e6e8eb; font: 700 17px system-ui, sans-serif; cursor: pointer; line-height: 1; }
      #zoom-ctl button:hover:not(:disabled) { background: #3a414c; }
      #zoom-ctl button:disabled { opacity: .35; cursor: default; }
      #zoom-ctl span { font: 600 10px system-ui, sans-serif; color: #9aa3ad; padding: 2px 0; }
      #toast { position: fixed; top: 56px; left: 50%; transform: translateX(-50%); z-index: 40;
        max-width: 90vw; padding: 8px 14px; border-radius: 8px; background: #5a2a2a; color: #fff;
        font-size: 13px; box-shadow: 0 4px 14px rgba(0,0,0,.35); }
      #toast.info { background: #2d4f6e; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
